[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "ai", "intelligence", "database", "backend", "shared", "workers"]

[project]
name = "helios"
version = "0.1.0"
description = "Helios — AI Career Intelligence Platform"
readme = "docs/architecture.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Phase 2: backend
backend = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0",
    "httpx>=0.27.0",
]
# Phase 4: intelligence
intelligence = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pgvector>=0.2.0",
    "numpy>=1.26.0",
]
# Dev
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
