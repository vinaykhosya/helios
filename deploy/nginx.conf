# Nginx Reverse Proxy configuration for helios.vinaykhosya.com
server {
    listen 80;
    server_name helios.vinaykhosya.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name helios.vinaykhosya.com;

    # SSL Certificate Paths (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/helios.vinaykhosya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helios.vinaykhosya.com/privkey.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
